<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Nilteks B2B E-Posta & Dijital Katalog Paneli</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-brand-950 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-100">

  <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Dekoratif Arka Plan Işıltısı -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Logo & Başlık -->
    <div class="text-center mb-8">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-teal-400 to-brand-700 items-center justify-center shadow-lg shadow-teal-900/40 mb-4 font-black text-3xl text-white">
        N
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">NİLTEKS</h1>
      <p class="text-xs text-teal-300 font-semibold tracking-wide uppercase mt-1">B2B E-Posta & Katalog Sistemi</p>
      <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-slate-900/60 border border-slate-700 text-xs text-slate-300">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-teal-400"></i>
        <span>Yetkili Yönetici Girişi</span>
      </div>
    </div>

    <!-- Hata Bildirim Kutusu -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 rounded-xl bg-red-950/80 border border-red-500/50 text-red-200 text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i>
      <span id="errorMessage">Kullanıcı adı veya şifre hatalı.</span>
    </div>

    <!-- Giriş Formu -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="username">Kullanıcı Adı</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="user" class="w-4 h-4"></i>
          </div>
          <input 
            type="text" 
            id="username" 
            required 
            autocomplete="username"
            placeholder="Kullanıcı adınızı girin" 
            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 text-white placeholder-slate-500 border border-slate-700 focus:border-teal-400 focus:ring-2 focus:ring-teal-400/20 focus:outline-none text-sm transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="password">Şifre</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input 
            type="password" 
            id="password" 
            required 
            autocomplete="current-password"
            placeholder="••••••••••••" 
            class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-900/90 text-white placeholder-slate-500 border border-slate-700 focus:border-teal-400 focus:ring-2 focus:ring-teal-400/20 focus:outline-none text-sm transition"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 transition"
          >
            <i id="togglePasswordIcon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full mt-2 bg-gradient-to-r from-teal-500 via-teal-600 to-brand-700 hover:from-teal-400 hover:to-brand-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-teal-900/30 transition flex items-center justify-center gap-2 text-sm"
      >
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sisteme Güvenli Giriş Yap</span>
      </button>
    </form>

    <div class="mt-6 text-center text-[11px] text-slate-500">
      &copy; Nilteks Tekstil San. ve Tic. Ltd. Şti. &bull; Denizli, Türkiye
    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('togglePasswordIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwd.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorMsg = document.getElementById('errorMessage');

      errorAlert.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Doğrulanıyor...</span>`;
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error('Giriş servisi yanıt vermedi (HTTP ' + res.status + '). Lütfen tekrar deneyin.');
        }
        if (data.success && data.token) {
          localStorage.setItem('nilteks_auth_token', data.token);
          // 30 günlük çerez olarak da yaz
          document.cookie = `nilteks_auth=${data.token}; path=/; max-age=2592000; SameSite=Lax`;
          window.location.href = '/panel.html';
        } else {
          errorMsg.textContent = data.error || 'Kullanıcı adı veya şifre hatalı.';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorAlert.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Sisteme Güvenli Giriş Yap</span>`;
        lucide.createIcons();
      }
    }

    // Eğer zaten geçerli bir token varsa doğrudan panele yönlendir
    (async () => {
      const token = localStorage.getItem('nilteks_auth_token') || getCookie('nilteks_auth');
      if (token) {
        try {
          const res = await fetch('/api/auth/check', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.authenticated) {
            window.location.href = '/panel.html';
          }
        } catch {}
      }
    })();

    function getCookie(name) {
      const matches = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + '=([^;]*)'));
      return matches ? decodeURIComponent(matches[1]) : undefined;
    }
  </script>
</body>
</html>
